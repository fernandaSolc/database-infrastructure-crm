# Configuração de Autenticação PostgreSQL (pg_hba.conf)
# =====================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Conexões locais (dentro do container)
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Conexões IPv4 locais
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Conexões da rede Docker (subnet específica)
host    all             all             172.20.0.0/16           scram-sha-256

# Conexões SSL obrigatórias para clientes externos
hostssl all             all             0.0.0.0/0               scram-sha-256

# Rejeitar conexões não-SSL de endereços externos
host    all             all             0.0.0.0/0               reject

# Configurações específicas para replicação (se necessário)
# local   replication     postgres                                peer
# host    replication     postgres        127.0.0.1/32            scram-sha-256
# host    replication     postgres        ::1/128                 scram-sha-256
